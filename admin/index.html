<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản trị catalogue · The Dahlia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css?v=1">
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">The Dahlia Voyage</p>
      <h1>Quản trị catalogue</h1>
      <p class="lede">Mỗi tour thuộc một đơn vị. Lưu sẽ ghi đè <code>shared/catalogue.json</code> và sinh lại <code>shared/data.js</code>.</p>
    </div>
    <div class="top-actions">
      <a class="btn ghost" href="../voyage/tours.html">Xem trang tour</a>
      <button type="button" class="btn ghost" id="download">Tải JSON</button>
      <button type="button" class="btn" id="save">Lưu và ghi đè</button>
    </div>
  </header>
  <p id="status" class="status" role="status"></p>
  <div class="shell">
    <nav class="tabs" aria-label="Mục quản trị">
      <button type="button" data-tab="operators" class="is-on">Đơn vị</button>
      <button type="button" data-tab="tours">Tour</button>
      <button type="button" data-tab="destinations">Điểm đến</button>
      <button type="button" data-tab="site">Trang web</button>
      <button type="button" data-tab="json">JSON</button>
    </nav>
    <main id="panel"></main>
  </div>
  <script src="../shared/data.js?v=17"></script>
  <script src="admin.js?v=1"></script>
</body>
</html>
